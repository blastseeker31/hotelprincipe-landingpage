# Despliegue en Hetzner (misma arquitectura que producción DO: red proyectitos + NPM).
# El contenedor NO publica puertos al host; NPM hace de reverse proxy con SSL.
services:
  hotel-principe:
    build: .
    container_name: hotel-principe
    restart: unless-stopped
    env_file: .env
    environment:
      HOST: "0.0.0.0"
      PORT: "8080"
    volumes:
      - ./data:/app/data
    networks:
      - proyectitos

networks:
  proyectitos:
    external: true
